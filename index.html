<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hellena • 1 aninho 🎀</title>

<!-- Preview ao compartilhar no WhatsApp -->
<meta property="og:title" content="Hellena está completando 1 aninho! 🎀">
<meta property="og:description" content="Clique para abrir o convite mágico da Hellena ✨">
<meta property="og:image" content="capa.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="capa.jpg">

<style>
  :root{
    --hotspot-bg: rgba(0,0,0,0); /* troque para algo como rgba(255,0,120,0.15) se quiser ENXERGAR os botões e ajustar a posição */
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#f7dde6; overflow:hidden;
    font-family: 'Georgia', serif;
  }

  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none;
    background:#f7dde6;
  }
  .screen.active{ opacity:1; visibility:visible; pointer-events:auto; }

  /* wrapper que tem exatamente o tamanho da imagem exibida -> base para os hotspots em % */
  .media-wrap{
    position:relative;
    display:inline-block;
    max-width:100vw;
    max-height:100dvh;
    line-height:0;
  }
  .media-wrap img{
    display:block;
    max-width:100vw;
    max-height:100dvh;
    width:auto; height:auto;
    user-select:none; -webkit-user-drag:none;
  }

  .hotspot{
    position:absolute;
    cursor:pointer;
    background: var(--hotspot-bg);
    border-radius: 16px;
  }

  #screen-video{ background:#000; }
  .mainVideo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:1;
  }
  .mainVideo.active-video{ z-index:2; }
  #skipBtn{
    position:fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    font-family: Arial, Helvetica, sans-serif;
    font-size:12px;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    letter-spacing:.3px;
    padding:10px 16px;
    z-index:20;
    cursor:pointer;
  }

  .particle{
    position:fixed; pointer-events:none; z-index:9999;
    font-size:18px;
    animation: particleFloat 900ms ease-out forwards;
    transform: translate(-50%,-50%);
    will-change: transform, opacity;
  }
  @keyframes particleFloat{
    0%{ opacity:1; transform: translate(-50%,-50%) scale(.6); }
    100%{ opacity:0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(25deg); }
  }
</style>
</head>
<body>

  <!-- TELA 1: capa que aparece ao abrir o link -->
  <div id="screen-cover" class="screen active">
    <div class="media-wrap">
      <img src="primeira.jpg" alt="Convite Hellena">
    </div>
  </div>

  <!-- TELA 2: sequência de vídeos -->
  <div id="screen-video" class="screen">
    <video id="video-a" class="mainVideo active-video" playsinline webkit-playsinline preload="auto"></video>
    <video id="video-b" class="mainVideo" playsinline webkit-playsinline preload="auto"></video>
    <div id="skipBtn">Clique aqui para pular introdução</div>
  </div>

  <!-- TELA 3: página interativa -->
  <div id="screen-interactive" class="screen">
    <div class="media-wrap">
      <img src="interativo.jpg" alt="Detalhes do convite">
      <div class="hotspot" id="hs-voltar-conv" style="top:2.5%; left:60%; width:32%; height:5%;"></div>
      <div class="hotspot" id="hs-confirmar"   style="top:67%; left:10%; width:23%; height:12%;"></div>
      <div class="hotspot" id="hs-local"       style="top:67%; left:38.5%; width:23%; height:12%;"></div>
      <div class="hotspot" id="hs-presente"    style="top:67%; left:67%; width:23%; height:12%;"></div>
    </div>
  </div>

  <!-- TELA 4: sugestões de presente -->
  <div id="screen-gifts" class="screen">
    <div class="media-wrap">
      <img src="presentes.jpg" alt="Sugestões de presente">
      <div class="hotspot" id="hs-voltar-gift" style="top:2.5%; left:60%; width:32%; height:5%;"></div>
    </div>
  </div>

  <audio id="audioFala" src="fala.mp3" preload="auto"></audio>
  <audio id="audioMusica" src="musicahellena.mp3" preload="auto" loop></audio>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const audioFala   = $('audioFala');
  const audioMusica = $('audioMusica');
  const videoEls    = [$('video-a'), $('video-b')];
  const skipBtn     = $('skipBtn');

  const videos = ['video1.mp4','video2.mp4'];
  let videoIndex = 0;
  let activeIdx = 0;
  let musicaIniciada = false;

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  // ---------- Efeito de florzinhas + brilho dourado ao tocar na tela ----------
  function createParticle(x, y, symbol){
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = symbol;
    const angle = Math.random() * Math.PI * 2;
    const dist = 25 + Math.random() * 45;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', (Math.sin(angle) * dist - 25) + 'px');
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
  function spawnParticles(x, y){
    const symbols = ['🌸','🌷','✨','✨'];
    for(let i=0;i<5;i++){
      createParticle(x, y, symbols[Math.floor(Math.random()*symbols.length)]);
    }
  }
  document.addEventListener('pointerdown', e => spawnParticles(e.clientX, e.clientY));

  // ---------- Fluxo principal ----------
  function setSource(el, src, onReady){
    const handler = () => {
      el.removeEventListener('loadeddata', handler);
      if(onReady) onReady();
    };
    el.addEventListener('loadeddata', handler);
    el.src = src;
    el.load();
  }

  // pré-carrega o vídeo 1 desde já, ainda na tela de capa, pra já estar pronto no clique
  let video1Ready = false;
  function preloadFirstVideo(){
    const el = videoEls[0];
    const onCanPlay = () => {
      video1Ready = true;
      el.removeEventListener('canplay', onCanPlay);
    };
    el.addEventListener('canplay', onCanPlay);
    el.src = videos[0];
    el.load();
  }
  preloadFirstVideo();

  function startExperience(){
    audioFala.currentTime = 0;
    audioFala.play().catch(()=>{});
    if(!musicaIniciada){
      audioMusica.play().catch(()=>{});
      musicaIniciada = true;
    }
    videoIndex = 0;
    activeIdx = 0;
    videoEls[0].classList.add('active-video');
    videoEls[1].classList.remove('active-video');

    const goPlay = () => {
      showScreen('screen-video');
      videoEls[activeIdx].currentTime = 0;
      videoEls[activeIdx].play().catch(()=>{});
      // pré-carrega o próximo vídeo no elemento oculto, ainda durante o primeiro
      if(videos.length > 1){
        setSource(videoEls[1 - activeIdx], videos[videoIndex + 1]);
      }
    };

    if(video1Ready){
      goPlay();
    } else {
      // só troca de tela quando o vídeo já estiver pronto (evita a tela preta)
      videoEls[activeIdx].addEventListener('canplay', goPlay, { once:true });
    }
  }

  videoEls.forEach((el, idx) => {
    el.addEventListener('ended', () => {
      if(idx !== activeIdx) return; // ignora 'ended' do vídeo que não está em exibição

      videoIndex++;
      if(videoIndex < videos.length){
        const nextIdx = 1 - activeIdx;
        activeIdx = nextIdx;
        videoEls[activeIdx].classList.add('active-video');
        videoEls[1 - activeIdx].classList.remove('active-video');
        videoEls[activeIdx].currentTime = 0;
        videoEls[activeIdx].play().catch(()=>{});

        // pré-carrega o vídeo seguinte, se houver, no elemento que ficou livre
        if(videoIndex + 1 < videos.length){
          setSource(videoEls[1 - activeIdx], videos[videoIndex + 1]);
        }
      } else {
        finishVideos();
      }
    });
  });

  function finishVideos(){
    videoEls.forEach(v => v.pause());
    showScreen('screen-interactive');
  }

  skipBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    finishVideos();
  });

  $('screen-cover').addEventListener('click', startExperience);

  // ---------- Hotspots ----------
  $('hs-voltar-conv').addEventListener('click', () => showScreen('screen-cover'));
  $('hs-voltar-gift').addEventListener('click', () => showScreen('screen-interactive'));
  $('hs-confirmar').addEventListener('click', () => window.open('https://wa.link/fovchv', '_blank'));
  $('hs-local').addEventListener('click', () => window.open('https://maps.app.goo.gl/tTowXPYqsZ1aTgkD9?g_st=iw', '_blank'));
  $('hs-presente').addEventListener('click', () => showScreen('screen-gifts'));

})();
</script>
</body>
</html>
